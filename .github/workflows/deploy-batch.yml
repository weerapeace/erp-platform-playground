name: Deploy Now (ขึ้นเว็บทันที)

# ปุ่ม "ขึ้นเว็บทันที" — เลื่อนสาขา prod ไปงานล่าสุดของ feat/host-portable เดี๋ยวนี้ → Vercel build prod 1 ครั้ง (= เว็บจริง)
# กดจาก: หน้า /admin/deploy · หน้า Actions "Run workflow" · `gh workflow run deploy-batch.yml` (ใช้เมื่อเจ้าของขอ/งานด่วนเท่านั้น)
# รอบอัตโนมัติ ~10 นาที = deploy-round.yml (บน feat/host-portable · เด้งทุก push) — ไม่ใช่ไฟล์นี้
# 2026-11-11: เอา schedule ออกแล้ว (เจ้าของเลือก) — ตั้งเวลาของ GitHub ไม่เคยยิงสักครั้ง (ไฟล์นี้ลงด้วย [skip ci] ทุกครั้ง)
#   ถ้าปล่อยไว้ วันที่ main ได้ commit ปกติ มันอาจตื่นมายิงซ้อน deploy-round → build ถี่ขึ้นเปล่า ๆ · ห้ามใส่ schedule กลับ
# ⚠️ workflow_dispatch ทำงานจากไฟล์บนสาขา default (main) เท่านั้น — แก้ไฟล์นี้ที่ main (ใส่ [skip ci] กัน CI/deploy สำรอง)
# docs/deploy-batch.md (บน feat/host-portable)
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "เหตุผล (ไม่บังคับ)"
        required: false

permissions:
  contents: write

concurrency:
  group: deploy-batch
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: เลื่อน prod ไปงานล่าสุดของ feat/host-portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # อ่านด้วย git ls-remote (repo สาธารณะ) — gh api พิมพ์ข้อความ 404 ลง stdout ตอนยังไม่มีสาขา prod
          SRC=$(git ls-remote "https://github.com/$REPO.git" refs/heads/feat/host-portable | cut -f1)
          DST=$(git ls-remote "https://github.com/$REPO.git" refs/heads/prod | cut -f1)
          if [ -z "$SRC" ]; then echo "อ่าน feat/host-portable ไม่ได้"; exit 1; fi
          echo "feat/host-portable=$SRC prod=${DST:-none}"
          if [ "$SRC" = "$DST" ]; then
            echo "ไม่มีงานใหม่ — ไม่ต้อง build"
            exit 0
          fi
          if [ -z "$DST" ]; then
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/prod -f sha="$SRC" > /dev/null
          else
            gh api -X PATCH "repos/$REPO/git/refs/heads/prod" -f sha="$SRC" -F force=true > /dev/null
          fi
          echo "ขึ้นเว็บรอบนี้: prod → ${SRC:0:8}"
          echo "### ขึ้นเว็บรอบนี้ → \`${SRC:0:8}\`" >> "$GITHUB_STEP_SUMMARY"
