name: Deploy Image Worker

# ตัวเสิร์ฟรูปบน Cloudflare (workers/img) — เด้งเฉพาะเมื่อแก้ worker นี้ · ไม่กระทบ build เว็บหลักบน Vercel
on:
  push:
    branches: [feat/host-portable, main]
    paths:
      - "workers/img/**"
      - ".github/workflows/deploy-img.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy image worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:        ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:       ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.95.0"
          # ชี้ config ของ worker นี้ชัดเจน (กัน wrangler ไปอ่าน wrangler.jsonc ของแอปหลัก)
          command:         deploy --config workers/img/wrangler.toml
